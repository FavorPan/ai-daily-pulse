[api]
api_key = ""                    # or set env var API_KEY
base_url = "https://apihub.agnes-ai.com/v1"
scoring_model = "agnes-2.5-flash"
summary_model = "agnes-2.5-flash"
price_in_per_m = 0
price_out_per_m = 0
# 可选：主 provider 故障时自动切换（留空则不启用 fallback）
# env: FALLBACK_BASE_URL / FALLBACK_API_KEY / FALLBACK_MODEL
fallback_base_url = ""
fallback_api_key = ""
fallback_model = ""
# 并发限流：同时在飞的 LLM 请求数上限。0=不限。
# provider 限流时调小此值可减少 429；429 仍会走 tenacity 退避重试。
# env: LLM_MAX_CONCURRENCY
max_concurrency = 0

[last30days]
enabled = true
engine_path = "~/.hermes/skills/last30days/scripts/last30days.py"
python_path = "python3.12"
timeout = 60
search_sources = "reddit,hackernews"

[pipeline]
lookback_days = 1
dedup_window_days = 90
content_cap = 4000
output_dir = "output"
history_path = "data/pushed.json"
fetch_timeout = 15
fetch_workers = 8
score_workers = 4
log_level = "INFO"

[insight]
sync_enabled = true

[timeouts]
# 各环节超时（秒）。env: TIMEOUTS_FETCH / TIMEOUTS_EXTRACT / TIMEOUTS_LLM
fetch = 15       # RSS 抓取（原 fetch_timeout 迁移至此）
extract = 20     # trafilatura 全文提取
llm = 60         # 单次 LLM 调用

[digest]
# digest 配额：防止单 topic 刷屏。
# env: DIGEST_MAX_PER_TOPIC / DIGEST_MIN_PER_TOPIC / DIGEST_MAX_TOTAL
max_per_topic = 8   # 每 topic 最多入选条数
min_per_topic = 1   # 每 topic 至少保留条数（若有）
max_total = 60      # 全 digest 总上限（按 score 全局降序截断）

[api]
api_key = ""                    # or set env var API_KEY
base_url = "https://openrouter.ai/api/v1"
scoring_model = "nvidia/nemotron-3-super-120b-a12b:free"
summary_model = "nvidia/nemotron-3-super-120b-a12b:free"
price_in_per_m = 0
price_out_per_m = 0

[last30days]
enabled = true
engine_path = "~/.hermes/skills/last30days/scripts/last30days.py"
python_path = "python3.12"
timeout = 60
search_sources = "reddit,hackernews"

[pipeline]
lookback_days = 1
dedup_window_days = 90
content_cap = 4000
output_dir = "output"
history_path = "data/pushed.json"
fetch_timeout = 15
fetch_workers = 8
score_workers = 4
log_level = "INFO"

[insight]
sync_enabled = true

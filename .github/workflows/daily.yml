name: Daily AI Pulse — Generate

on:
  schedule:
    # 每天北京时间 07:17 (UTC 23:17 前一天) — 避开整点高峰，减少 GitHub Actions 调度延迟
    - cron: "17 23 * * *"
  workflow_dispatch:  # 手动触发

permissions:
  contents: write
  deployments: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: |
            data/pushed.json
            data/feed_health.json
          key: daily-pulse-history-${{ github.ref }}
          restore-keys: daily-pulse-history-

      - name: Run pipeline
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python main.py

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ data/
          git diff --cached --quiet || git commit -m "chore: daily output $(date -u +%Y-%m-%d)"
          git pull --rebase && git push

      - name: Create GitHub Deployment
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOY_ID=$(gh api \
            /repos/${{ github.repository }}/deployments \
            -f ref="${{ github.ref_name }}" \
            -f environment="production" \
            -f description="Daily AI Pulse - $(date -u +%Y-%m-%d)" \
            -F auto_merge=false \
            --jq '.id')
          gh api \
            /repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses \
            -f state="success" \
            -f description="Pipeline completed"

name: Daily AI Pulse — Generate & Publish

on:
  schedule:
    # 每天北京时间 09:00 (UTC 01:00)
    - cron: "0 1 * * *"
  workflow_dispatch:  # 手动触发

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: |
            data/pushed.json
            data/feed_health.json
          key: daily-pulse-history-${{ github.ref }}
          restore-keys: daily-pulse-history-

      - name: Run pipeline
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python main.py

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ data/
          git diff --cached --quiet || git commit -m "chore: daily output $(date -u +%Y-%m-%d)"
          git push

      - name: Setup xurl
        if: ${{ secrets.XURL_CONFIG != '' }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/xdevplatform/xurl/main/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          mkdir -p ~/.xurl
          echo "${{ secrets.XURL_CONFIG }}" | base64 -d > ~/.xurl/config.yaml

      - name: Publish to X
        if: ${{ secrets.XURL_CONFIG != '' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python publish.py --lang zh
